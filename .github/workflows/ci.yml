name: CI

# Format, lint, type-check, and test. A violation of any of those goes red.
on:
  push:
    branches: [main]
  pull_request:

# Newer commits on the same ref replace an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Pin matches .tool-versions. cache: true stores DENO_DIR (downloaded
      # deps); setup-deno also caches the Deno binary itself.
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true

      - name: Install locked dependencies
        run: deno ci

      - name: Format
        run: deno fmt --check .

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Test
        run: deno test -A
