name: CI

# Format, lint, type-check, and test. A violation of any of those goes red.
on:
  push:
    branches: [main]
  pull_request:

# Newer commits on the same ref replace an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            run: deno fmt --check .
          - name: Lint
            run: deno lint
          - name: Type check
            run: deno check
          - name: Test
            run: deno test -A
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
