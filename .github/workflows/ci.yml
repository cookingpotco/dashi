name: CI

# Format, lint, type-check, and test. A violation of any of those goes red.
on:
  push:
    branches: [main]
  pull_request:

# PRs replace an in-flight run. A second push to main does not cancel, so it
# cannot abort a publish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Shared with setup-deno so the cache path matches what Deno actually uses.
  DENO_DIR: ${{ github.workspace }}/.deno

jobs:
  # Populate DENO_DIR from the lockfile and save it under a lockfile-only key
  # so later jobs, and other branches with the same lockfile, can skip the
  # download. setup-deno's own cache includes the job id, which would prevent
  # that sharing.
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - uses: actions/cache@v5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Install locked dependencies
        run: deno ci

  check:
    name: ${{ matrix.name }}
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            run: deno fmt --check .
            timeout: 10
          - name: Lint
            run: deno lint
            timeout: 10
          - name: Type check
            run: deno check
            timeout: 10
          - name: Test
            run: deno task test
            timeout: 10
          - name: Integration
            run: deno task test:int
            timeout: 10
          - name: E2E
            run: deno task test:e2e
            timeout: 20
          - name: Publish dry-run
            run: deno publish --dry-run
            timeout: 10
          - name: Fresh project
            run: deno run -A scripts/verify_fresh_project.ts --linked
            timeout: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - uses: actions/cache@v5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - uses: actions/cache@v5
        if: matrix.name == 'E2E'
        with:
          path: ~/.cache/astral
          key: ${{ runner.os }}-astral-${{ hashFiles('deno.lock') }}
          restore-keys: ${{ runner.os }}-astral-

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && matrix.name == 'E2E' }}
        with:
          name: e2e-results
          path: e2e/results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - uses: actions/cache@v5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Publish
        run: deno publish

  verify-release:
    needs: [publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - uses: actions/cache@v5
        with:
          path: ${{ env.DENO_DIR }}
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Verify release
        run: deno run -A scripts/verify_fresh_project.ts --registry
